import java.util.Properties

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    alias(libs.plugins.kotlin.compose)
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream -> localProps.load(stream) }
}

android {
    namespace 'com.messageguard'
    compileSdk 36
    defaultConfig {
        applicationId "com.messageguard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProps.getProperty('GEMINI_API_KEY', '')}\""
        
        // Alert Configuration from local.properties / .env
        buildConfigField "String", "ALERT_EMAIL", "\"${localProps.getProperty('ALERT_EMAIL', '')}\""
        buildConfigField "String", "ALERT_FROM", "\"${localProps.getProperty('ALERT_FROM', '')}\""
        buildConfigField "String", "RESEND_API_KEY", "\"${localProps.getProperty('RESEND_API_KEY', '')}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Prevent AAPT from compressing binary ML assets (important for mmap loading)
    aaptOptions {
        noCompress "tflite", "onnx"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/license.txt'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/NOTICE.txt'
            excludes += 'META-INF/notice.txt'
            excludes += 'META-INF/ASL2.0'
            excludes += 'META-INF/*.kotlin_module'
            excludes += 'META-INF/NOTICE.md'
            excludes += 'META-INF/LICENSE.md'
        }
    }

    signingConfigs {
        release {
            def storeFilePath = localProps.getProperty("RELEASE_STORE_FILE", "messageguard-release.keystore")
            storeFile file(storeFilePath)
            storePassword localProps.getProperty("RELEASE_STORE_PASSWORD", "")
            keyAlias localProps.getProperty("RELEASE_KEY_ALIAS", "")
            keyPassword localProps.getProperty("RELEASE_KEY_PASSWORD", "")
        }
    }

    // 1. Optimize buildTypes for Hackathon Release & Demo testing
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    // HybridDecisionEngine is deliberately JVM-testable, but it emits Android diagnostic logs.
    // Give Android framework stubs their documented default return values in local unit tests.
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // 2. Enable ABI Splits to generate single-architecture APKs (~15-20MB per file)
    splits {
        abi {
            enable true
            reset()
            // Package for modern test devices (arm64-v8a) & common fallback devices (armeabi-v7a)
            include "arm64-v8a", "armeabi-v7a"
            universalApk true // Builds one multi-arch universal fallback APK
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation libs.lifecycle.runtime.ktx
    implementation libs.activity.compose
    implementation platform(libs.compose.bom)
    implementation libs.ui
    implementation libs.ui.graphics
    implementation libs.ui.tooling.preview
    implementation libs.material3
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.ui.test.junit4
    debugImplementation libs.ui.tooling
    debugImplementation libs.ui.test.manifest
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // TFLite core + Select-TF-Ops delegate (core updated to 2.17.0 for FULLY_CONNECTED v12 opcode support)
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.16.1'

    // ONNX Runtime (BODMAS model)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'

    // Secure Preferences for email credentials
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Apache POI for Excel export
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // WorkManager for weekly auto-export
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Google ML Kit Barcode Scanning for QR Phishing Detection
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // Google ML Kit Text Recognition for Circle to Scan OCR
    implementation 'com.google.mlkit:text-recognition:16.0.0'
}
